name: Build deb
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Install Theos
    uses: waruhachi/theos-action@v2.6.3
    with:
      theos-src: theos/theos
      theos-branch: master
      sdks-src: theos/sdks
      sdks-branch: master

  - name: Build package
    run: |
      export THEOS="${{ github.workspace }}/theos"
      make clean package FINALPACKAGE=1

  - name: Upload deb
    uses: actions/upload-artifact@v4
    with:
      name: HappSkyBackground-deb
      path: packages/*.deb

